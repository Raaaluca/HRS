<body class="index-page">

<header id="header" class="header d-flex align-items-center fixed-top">
    <div class="container-fluid container-xl position-relative d-flex align-items-center">

        <a href="/index" class="logo d-flex align-items-center me-auto">
            <img src="/img/logo.png" alt="">
            <h1 class="sitename">
                <div th:text="${authenticationDetails}"></div>
            </h1>
        </a>

        <nav id="navmenu" class="navmenu">
            <ul>

            </ul>
            <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
        </nav>

        <a class="btn-getstarted" href="/index">Logout</a>

    </div>
</header>

<main class="main">
    <section id="services" class="services section light-background">
    <table class="table table-striped" style="width:70%">
        <thead>
        <tr>
            <th scope="col">Name</th>
            <th scope="col">Job Title</th>
            <th scope="col">Gender</th>
            <th scope="col">Email</th>
            <th scope="col">Contract Start Date</th>
            <th scope="col">Contract End Date</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="employee : ${employees}">
            <td><span th:text="${employee.name}"> Name </span></td>
            <td><span th:text="${employee.jobTitle}"> Job Title </span></td>
            <td><span th:text="${employee.gender}"> Gender </span></td>
            <td><span th:text="${employee.email}"> Email </span></td>
            <td><span th:text="${employee.startDate}"> Contract Start Date </span></td>
            <td><span th:text="${employee.endDate}"> Contract End Date </span></td>
            <td>
            <span><button type="button" class="btn btn-outline-success"
                          th:onclick="|window.location.href='/employeelist'|">
                Update
            </button>
                </span>
            </td>
            <td>
                <a class="btn btn-outline-danger">
                <span>
                Delete
                    </span>
                </a>
            </td>
        </tr>
        </tbody>
    </table>
    </section>
</main>

<!-- Scroll Top -->
<a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>
