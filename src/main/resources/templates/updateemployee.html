<body class="index-page">

<header id="header" class="header d-flex align-items-center fixed-top">
    <div class="container-fluid container-xl position-relative d-flex align-items-center">

        <a href="/index" class="logo d-flex align-items-center me-auto">
            <img src="/img/logo.png" alt="">
            <h1 class="sitename">
                <div th:text="${authenticationDetails}"></div>
            </h1>
        </a>

        <nav id="navmenu" class="navmenu">
            <ul>

            </ul>
            <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
        </nav>

        <a class="btn-getstarted" href="/logout">Logout</a>

    </div>
</header>

<main class="main">

    <!-- Services Section -->
    <section id="services" class="services section light-background">

        <!-- Section Title -->
        <div class="container section-title" data-aos="fade-up">
        </div><!-- End Section Title -->

        <div class="container">

            <div class="row g-5">

                <div sec:authorize="hasAuthority('ADMIN')" data-aos="fade-up" data-aos-delay="100">
                    <form ACTION="#" th:action="@{/admin/update}" th:modelAttribute="employeeUpdateDto" method="POST">
                        <input type="hidden" th:value="${employeeUpdateDto.id}" name="id"/>
                        <input type="hidden" th:value="${employeeUpdateDto.jobTitle}" name="jobTitle"/>
                        <p><strong> Name </strong></p>
                        <input th:value="${employeeUpdateDto.name}" name="name"/>
                        <p class="error" th:if="${#fields.hasErrors('employeeUpdateDto.name')}" th:errors="${employeeUpdateDto.name}"/>
                        <p></p>
                        <p><strong> City </strong></p>
                        <input th:value="${employeeUpdateDto.city}" name="city"/>
                        <p></p>
                        <p><strong> Phone </strong></p>
                        <input th:value="${employeeUpdateDto.phoneNumber}" name="phoneNumber"/>
                        <p class="error" th:if="${#fields.hasErrors('employeeUpdateDto.phoneNumber')}" th:errors="${employeeUpdateDto.phoneNumber}"/>
                        <p></p>
                        <p><strong> Address </strong></p>
                        <input th:value="${employeeUpdateDto.address}" name="address"/>
                        <!-- ADD ALL THE OTHER FIELDS THAT ARE PART OF THE OBJECT -->
                        <p></p>
                        <p></p>
                        <p></p>
                        <button type="submit" class="btn btn-outline-success"> Update details </button>
                    </form>
                </div><!-- End Service Item -->
            </div>

        </div>

    </section><!-- /Services Section -->

</main>

<!-- Scroll Top -->
<a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

<!-- Preloader -->
<div id="preloader"></div>

<!-- Vendor JS Files -->
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/php-email-form/validate.js"></script>
<script src="/vendor/aos/aos.js"></script>
<script src="/vendor/glightbox/js/glightbox.min.js"></script>
<script src="/vendor/swiper/swiper-bundle.min.js"></script>

<!-- Main JS File -->
<script src="/js/main.js"></script>

</body>

</html>
